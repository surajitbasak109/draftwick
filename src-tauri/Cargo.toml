[package]
name = "draftwick"
version = "0.1.0"
description = "A fast, minimal editor for quick Markdown and text drafts"
license = "MIT"
repository = "https://github.com/surajitbasak109/draftwick"
edition = "2021"

[lib]
name = "draftwick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
thiserror = "2"
trash = "5.2.9"
tauri-plugin-clipboard-manager = "2.5.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
