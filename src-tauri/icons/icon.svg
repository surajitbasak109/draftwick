<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Draftwick</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4f8f"/>
      <stop offset="1" stop-color="#1b2347"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="14" result="blur"/><feFlood flood-color="#0b1030" flood-opacity="0.35"/><feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- app tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- page with a folded corner -->
  <g filter="url(#shadow)">
    <path d="M250 150h360l180 180v454a90 90 0 0 1-90 90H250a90 90 0 0 1-90-90V240a90 90 0 0 1 90-90z" fill="#f6f8ff"/>
  </g>
  <path d="M610 150v120a60 60 0 0 0 60 60h120z" fill="#c9d3f2"/>
  <!-- lines of text -->
  <rect x="250" y="400" width="400" height="44" rx="22" fill="#4d7cff"/>
  <rect x="250" y="500" width="500" height="44" rx="22" fill="#b8c2e0"/>
  <rect x="250" y="600" width="330" height="44" rx="22" fill="#b8c2e0"/>
  <!-- the wick: a flame, burning at the end of the draft -->
  <path d="M742 560C742 640 840 690 840 790a98 98 0 0 1-196 0c0-50 30-82 52-118 8 30 22 40 34 40 -2-50 12-100 12-152z" fill="url(#flame)"/>
  <path d="M742 740c0 34 30 50 30 82a30 30 0 0 1-60 0c0-34 30-46 30-82z" fill="#fff3d1" opacity="0.9"/>
</svg>
