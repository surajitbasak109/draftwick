<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draftwick</title>
  </head>
  <body>
    <section id="welcome" hidden>
      <div class="welcome-card">
        <h1>Welcome to Draftwick</h1>
        <p>
          Choose a directory where your drafts will be saved. Each draft is stored there as a
          Markdown file named after the date and time you started it.
        </p>
        <button id="welcome-choose" class="primary" type="button">Choose draft directory…</button>
        <button id="welcome-default" class="link" type="button">Use ~/Drafts instead</button>
        <p id="welcome-error" role="alert" hidden></p>
      </div>
    </section>
    <div id="app" hidden>
      <aside id="sidebar" aria-label="Drafts"></aside>
      <main id="editor"></main>
      <footer id="statusbar" aria-label="Status">
        <span id="status-name"></span>
        <span id="status-selection" hidden></span>
        <span id="status-position">Ln 1, Col 1</span>
        <span id="status-state"></span>
        <span id="status-autosave" hidden>Autosave off</span>
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="switcher" hidden>
      <div class="panel">
        <input id="switcher-input" type="text" placeholder="Go to draft…" autocomplete="off" spellcheck="false" />
        <ul id="switcher-list"></ul>
      </div>
    </div>
    <div id="choice" hidden role="alertdialog" aria-labelledby="choice-message">
      <div class="panel">
        <p id="choice-message"></p>
        <div class="actions">
          <button id="choice-primary" class="primary" type="button">Save</button>
          <button id="choice-secondary" type="button">Don't Save</button>
          <button id="choice-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <div id="about" hidden role="dialog" aria-labelledby="about-title">
      <div class="panel">
        <div class="dialog-head">
          <span id="about-title" class="dialog-title">About Draftwick</span>
          <button id="about-close" class="dialog-close" type="button" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <h2 id="about-name"></h2>
        <p id="about-version"></p>
        <p id="about-description"></p>
      </div>
    </div>
    <div id="help" hidden role="dialog" aria-labelledby="help-title">
      <div class="panel">
        <div class="dialog-head">
          <span id="help-title" class="dialog-title">Keyboard shortcuts</span>
          <button id="help-close" class="dialog-close" type="button" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div id="help-body"></div>
      </div>
    </div>
    <div id="rename" hidden>
      <div class="panel">
        <input id="rename-input" type="text" placeholder="New name (no extension)" autocomplete="off" spellcheck="false" />
        <p id="rename-error" hidden></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
